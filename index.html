<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>数学問題ライブラリ</title>
  <meta name="description" content="単元・難易度・タグから数学の問題PDFを検索できる生徒向けページです。">
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div>
        <p class="eyebrow">MATH PROBLEM LIBRARY</p>
        <h1>数学問題ライブラリ</h1>
        <p class="header-copy">単元・難易度・タグから、取り組みたい問題をすぐに探せます。</p>
      </div>
      <div class="header-badge" aria-label="生徒用"><span>生徒用</span></div>
    </div>
  </header>

  <section class="container news-section" aria-labelledby="newsHeading">
    <div class="news-panel">
      <div class="news-heading-row">
        <div>
          <p class="results-label">WHAT'S NEW</p>
          <h2 id="newsHeading">新着情報</h2>
        </div>
        <span class="news-limit-label">最新5件</span>
      </div>
      <div id="newsList" class="news-list" aria-live="polite">
        <p class="news-loading">新着情報を読み込んでいます…</p>
      </div>
    </div>
  </section>

  <main class="container main-grid">
    <aside class="filter-panel" aria-label="検索条件">
      <div class="panel-title-row">
        <h2>問題を絞り込む</h2>
        <button id="resetFilters" class="text-button" type="button">リセット</button>
      </div>
      <label class="field"><span>キーワード</span><input id="searchInput" type="search" placeholder="例：微分、推薦、共通テスト"></label>
      <label class="field"><span>科目</span><select id="subjectFilter"><option value="">すべて</option></select></label>
      <label class="field"><span>単元</span><select id="unitFilter"><option value="">すべて</option></select></label>
      <label class="field"><span>難易度</span><select id="difficultyFilter">
        <option value="">すべて</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option>
      </select></label>
      <div class="field"><span>#タグ</span><div id="tagFilters" class="tag-filter-list" aria-label="タグ一覧"></div></div>
    </aside>

    <section class="content-panel">
      <div class="results-head">
        <div><p class="results-label">検索結果</p><h2><span id="resultCount">0</span> 問</h2></div>
        <label class="sort-control"><span>並び順</span><select id="sortSelect">
          <option value="newest">新しい順</option><option value="oldest">古い順</option><option value="title">タイトル順</option><option value="difficultyAsc">難易度が低い順</option><option value="difficultyDesc">難易度が高い順</option>
        </select></label>
      </div>
      <div id="activeFilters" class="active-filters" aria-live="polite"></div>
      <div id="problemList" class="problem-list" aria-live="polite"></div>
      <div id="emptyState" class="empty-state" hidden><div class="empty-icon">∅</div><h3>該当する問題がありません</h3><p>検索条件を少し広げてみてください。</p></div>
      <div id="loadError" class="error-state" hidden><h3>問題データを読み込めませんでした</h3><p>公開ファイル <code>data/problems.json</code> を確認してください。</p></div>
    </section>
  </main>

  <footer class="site-footer"><div class="container"><p>PDFはOneDriveなどの共有リンクから開きます。</p></div></footer>
  <script src="./assets/app.js" defer></script>
</body>
</html>
